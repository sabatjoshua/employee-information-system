name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore EmployeeInformationSystem.sln

      - name: Build
        run: dotnet build EmployeeInformationSystem.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test EmployeeInformationSystem.sln --configuration Release --no-build

      - name: Build Docker image
        run: |
          docker build \
            -f src/EmployeeInformationSystem.API/Dockerfile \
            -t employee-information-system-api:${{ github.sha }} .

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE=ghcr.io/sabatjoshua/employee-information-system-api

          docker tag employee-information-system-api:${{ github.sha }} $IMAGE:${{ github.sha }}
          docker tag employee-information-system-api:${{ github.sha }} $IMAGE:latest

          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest